<!DOCTYPE html>
<html>
<head>
  <title>Agasthyarkoodam Trekkers Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      color: #333;
    }
    .report-container {
      max-width: 900px;
      margin: auto;
      padding: 24px 4px;
      background: #fff;
      border: 2px solid #2563eb;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      overflow-x: auto;
    }
    .report-header {
      text-align: center;
      margin-bottom: 18px;
    }
    .report-title {
      font-size: 2rem;
      color: #2563eb;
      font-weight: bold;
    }
    .report-details {
      margin-bottom: 16px;
      padding: 10px;
      background: #e0f2fe;
      border-radius: 8px;
      border: 1px solid #93c5fd;
    }
    .report-details strong {
      color: #0b60a5;
    }
    .table-container {
      overflow-x: auto;
      width: 100%;
      text-align: center;
    }
    .table {
      width: 100%;
      margin: 0 auto;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 11px;
      table-layout: fixed;
      max-width: 900px;
    }
    .table th, .table td {
      padding: 6px;
      text-align: left;
      box-sizing: border-box;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
      font-size: 11px;
      border-right: 1px solid #e5e7eb;
    }
    .table th {
      background: #bfdbfe;
      font-weight: bold;
      color: #1e40af;
      text-transform: uppercase;
      font-size: 11px;
    }
    .table tbody tr {
      border-bottom: 2px solid #d1d5db !important;
    }
    .table tbody tr:last-child {
      border-bottom: none;
    }
    .table tbody tr:nth-child(odd) {
      background: #f8fafc;
    }
    .table tbody tr:nth-child(even) {
      background: #f1f5f9;
    }
    .summary-row td {
      font-weight: bold;
      background: #fde68a;
      color: #065f46;
      border-top: 2px solid #2563eb;
      font-size: 11px;
    }
    /* Column widths */
    .table th.slno, .table td.slno { width: 28px; max-width: 28px; text-align: center;}
    .table th.ticketno, .table td.ticketno { width: 70px; max-width: 70px; }
    .table th.name, .table td.name { width: 120px; max-width: 120px; }
    .table th.gender, .table td.gender { width: 36px; max-width: 36px; }
    .table th.age, .table td.age { width: 28px; max-width: 28px; text-align: center;}
    .table th.idtype, .table td.idtype { width: 60px; max-width: 60px; }
    .table th.idnumber, .table td.idnumber { width: 75px; max-width: 75px; }
    .table th.mobile, .table td.mobile { width: 70px; max-width: 70px; }
    .table th.trekdate, .table td.trekdate { width: 70px; max-width: 70px; }
    .table th.amount, .table td.amount { width: 60px; max-width: 60px; text-align: right;}
    @media print {
      body, .report-container, .table-container {
        width: 100% !important;
        max-width: 100% !important;
        font-size: 11px !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .report-container {
        margin: 0 auto !important;
        border-width: 1px !important;
        box-shadow: none !important;
        border-radius: 8px !important;
        max-width: 900px !important;
        page-break-inside: avoid;
      }
      .table {
        max-width: 900px !important;
        width: 100% !important;
        margin: 0 auto !important;
        table-layout: fixed !important;
        font-size: 11px !important;
      }
      .table th, .table td {
        font-size: 11px !important;
        padding: 6px !important;
      }
      @page {
        margin: 14mm 6mm 14mm 6mm;
      }
    }
  </style>
</head>
<body>
  <div class="report-container">
    <div class="report-header">
      <div class="report-title">Agasthyarkoodam Trekkers Report</div>
      <div class="text-xl text-green-700 font-semibold">Thiruvananthapuram Wildlife Division</div>
    </div>
    <div class="report-details">
      <div>
        <strong>Date Range:</strong>
        <?= dateFrom ?> to <?= dateTo ?>
      </div>
    </div>
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th class="slno">Sl No</th>
            <th class="ticketno">Ticket No</th>
            <th class="name">Name</th>
            <th class="gender">Gender</th>
            <th class="age">Age</th>
            <th class="idtype">ID Type</th>
            <th class="idnumber">ID Number</th>
            <th class="mobile">Mobile</th>
            <th class="trekdate">Trek Date</th>
            <th class="amount">Amount Remitted (₹)</th>
          </tr>
        </thead>
        <tbody>
          <? for (var i = 0; i < trekkers.length; i++) { ?>
          <tr>
            <td class="slno"><?= trekkers[i].SlNo ?></td>
            <td class="ticketno"><?= trekkers[i].TicketNo ?></td>
            <td class="name"><?= trekkers[i].Name ?></td>
            <td class="gender"><?= trekkers[i].Gender ?></td>
            <td class="age"><?= trekkers[i].Age ?></td>
            <td class="idtype"><?= trekkers[i].IDType ?></td>
            <td class="idnumber"><?= trekkers[i].IDNumber ?></td>
            <td class="mobile"><?= trekkers[i].Mobile ?></td>
            <td class="trekdate"><?= trekkers[i].TrekDate ?></td>
            <td class="amount"><?= trekkers[i].AmountRemitted ?></td>
          </tr>
          <? } ?>
        </tbody>
        <tfoot>
          <tr class="summary-row">
            <td colspan="9" class="text-right pr-6">Total Amount Remitted:</td>
            <td><?= typeof totalAmount !== "undefined" ? "₹" + totalAmount : "" ?></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="mt-3 text-blue-700 font-semibold text-md">
      Total trekkers in report: <strong><?= trekkers.length ?></strong>
    </div>
  </div>
</body>
</html>
